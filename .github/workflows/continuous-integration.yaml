name: Frontend Continuous Integration
run-name: ${{ github.actor }} triggered Frontend CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    frontend-ci:
        name: Frontend CI
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Clean install
              run: npm ci

            - name: Run ESLint
              run: npm run lint
